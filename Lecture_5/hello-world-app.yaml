AWSTemplateFormatVersion: "2010-09-09"
Description: Hello World application (Flask in an Auto Scaling group behind a load balancer)

Parameters:

  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey   # the key pair every AWS Academy Learner Lab has

Resources:

  # CHANGE 1: Launch Template instead of Launch Configuration.
  # New AWS accounts (created after 2024-10-01) are not allowed to create
  # Launch Configurations at all, so the original "Lc" would fail.
  Lt:
    Type: AWS::EC2::LaunchTemplate
    # The cfn-init setup list. UserData below calls it with --resource Lt
    Metadata:
      # CHANGE 2: let cfn-init download the file from our PRIVATE S3 bucket,
      # using the permissions of the role that the instance has (LabRole).
      # The original used a plain https link, which gives 403 on a private bucket.
      AWS::CloudFormation::Authentication:
        S3Auth:
          type: S3
          buckets:
            - !ImportValue S3Bucket
          roleName: LabRole
      AWS::CloudFormation::Init:
        configSets:
          InstallAndRun:
            - "Configure"
        Configure:
          packages:
            yum:
              python3: []
              python3-pip: []
          files:
            /opt/helloworld.py:
              owner: root
              group: root
              mode: '000755'
              source: !Sub
                - "https://${bucket}.s3.${AWS::Region}.${AWS::URLSuffix}/hello-world-flask.py"
                - bucket: !ImportValue S3Bucket
              authentication: S3Auth
            /etc/systemd/system/helloworld.service:
              owner: root
              group: root
              mode: '000644'
              content: |
                [Unit]
                Description=HelloWorld service
                After=network.target
                [Service]
                Type=simple
                User=root
                # CHANGE 3: start it with python3 explicitly, so it does not
                # depend on a "#!" first line inside the .py file
                ExecStart=/usr/bin/python3 /opt/helloworld.py
                Restart=on-abort
                [Install]
                WantedBy=multi-user.target
          commands:
            installflask:
              command: "pip3 install flask"
              test: "which pip3"
            reloadsystemd:
              command: "systemctl daemon-reload"
          services:
            sysvinit:
              helloworld:
                enabled: true
                ensureRunning: true
    Properties:
      LaunchTemplateData:
        InstanceType: t2.micro
        ImageId: !Ref ImageId
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !Ref AppSg
        IamInstanceProfile:
          Name: LabInstanceProfile
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            /opt/aws/bin/cfn-init -v \
            --stack ${AWS::StackName} \
            --resource Lt --configsets InstallAndRun \
            --region ${AWS::Region}

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App Sg
      SecurityGroupIngress:
        - IpProtocol: tcp
          SourceSecurityGroupId: !Ref ElbSg
          FromPort: 5000
          ToPort: 5000
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      VpcId: !ImportValue VpcId

  Elb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Subnets:
        - !ImportValue Subnet1Id
        - !ImportValue Subnet2Id
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ElbSg

  ElbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Elb Sg
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      VpcId: !ImportValue VpcId

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Elb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref Tg

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 5000
      Protocol: HTTP
      VpcId: !ImportValue VpcId

  Asg:
    DependsOn: Listener
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MaxSize: "1"
      MinSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier:
        - !ImportValue Subnet1Id
        - !ImportValue Subnet2Id
      LaunchTemplate:
        LaunchTemplateId: !Ref Lt
        Version: !GetAtt Lt.LatestVersionNumber
      TargetGroupARNs:
        - !Ref Tg

Outputs:
  LoadBalancerDns:
    Description: Open this address (or curl it)
    Value: !GetAtt Elb.DNSName